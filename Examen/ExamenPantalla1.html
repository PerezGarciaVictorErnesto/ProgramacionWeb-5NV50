<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Examen.css">
    <title>Examen</title>
</head>
<body>
    <div class="Container-Form">
        <!--Form para iniciar sesión-->
        <form class="Form">
            <!--Componentes del form-->
            <label class="Form-Title"><h2>Formulario de datos</h2></label>
            <label><input type="text" class="Form-Input-Text" placeholder="Nombre"/></label>
            <label><input type="email" class="Form-Input-Text" placeholder="Correo"/></label>
            <label><input type="password" class="Form-Input-Text" placeholder="Contraseña"/></label>
            <label><input type="file" accept="application/pdf" class="Form-Submit"/></label>
            <label><input type="submit" value="Aceptar" class="Form-Submit"/> </label>
            <label><input type="submit" value="Cancelar" class="Form-Submit" style="background-color: red;"/></label>
            <label class="Form-Secondary-Text">
                <a class="Form-A" href="./ExamenPantalla2.html">Pantalla Imagen</a>
                <hr><hr><hr><hr><hr>
                <a class="Form-A" href="./ExamenPantalla3.html">Pantalla Aviso privacidad</a>
            </label>
        </form>
    </div>
</body>
</html>
